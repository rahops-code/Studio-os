<title>Studio OS · Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101827;--panel2:#151f31;--line:#263348;--muted:#8fa0b8;--text:#edf2fb;--accent:#818cf8;--accent2:#6366f1;--green:#34d399;--amber:#fbbf24;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -15%,#202b50 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#1b2940;color:var(--text);border-radius:10px;padding:9px 12px}button:hover{border-color:#6575a0;background:#243451}.primary{background:var(--accent2);border-color:var(--accent2);color:white}.primary:hover{background:#5558db}.danger{color:#fda4af}.muted{color:var(--muted)}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:22px 15px;background:#0b1220;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:5px 8px 25px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#818cf8,#4f46e5);display:grid;place-items:center;font-weight:900}.brand strong{font-size:15px;letter-spacing:.04em}.brand small{display:block;color:var(--muted);font-size:11px}.navlabel{font-size:10px;color:#71829c;text-transform:uppercase;letter-spacing:.15em;padding:12px 10px 7px}.nav{width:100%;text-align:left;background:transparent;border:0;color:#aebbd0;margin:2px 0;padding:11px 12px}.nav.active,.nav:hover{background:#1b2940;color:white}.nav span{margin-right:10px}.sidefoot{position:absolute;bottom:18px;left:20px;right:20px;color:var(--muted);font-size:11px}.main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px;position:sticky;top:0;background:#0b1220ed;backdrop-filter:blur(14px);z-index:4}.search{max-width:460px;width:48%;background:#111c2e;border:1px solid var(--line);border-radius:11px;padding:10px 13px;color:white}.topright{display:flex;align-items:center;gap:10px}.content{padding:28px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:23px}.pagehead h1{margin:0;font-size:25px;letter-spacing:-.04em}.pagehead p{color:var(--muted);margin:5px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.panel,.metric{background:linear-gradient(145deg,#131e30,#0f1828);border:1px solid var(--line);border-radius:15px;padding:17px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:27px;margin-top:8px}.metric .mi{float:right;font-size:19px;color:#a5b4fc}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:15px}.panel h3{margin:0 0 14px;font-size:15px}.sectionrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.taskrow,.eventrow,.projectrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #253247}.taskrow:last-child,.eventrow:last-child,.projectrow:last-child{border:0}.taskrow input{accent-color:var(--accent2);width:16px;height:16px}.taskmain{flex:1;min-width:0}.taskmain b{display:block;font-weight:600}.taskmain small{color:var(--muted)}.pill{font-size:10px;padding:4px 7px;border-radius:20px;background:#27334a;color:#cbd5e1;white-space:nowrap}.high{background:#4b2432;color:#fda4af}.medium{background:#493a1d;color:#fcd34d}.low{background:#183c39;color:#6ee7b7}.bar{height:7px;background:#273348;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#a5b4fc);border-radius:9px}.projectrow{display:block}.projecttop{display:flex;justify-content:space-between;gap:10px}.alert{padding:11px 13px;border-radius:11px;background:#3c202b;border:1px solid #673346;color:#fecdd3;margin-bottom:15px}.note{width:100%;min-height:145px;resize:vertical;background:#0b1423;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:#0b1423;color:white;border:1px solid var(--line);border-radius:9px;padding:10px;width:100%}.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}.kancol{background:#0d1625;border:1px solid var(--line);border-radius:13px;padding:12px;min-height:220px}.kanhead{display:flex;justify-content:space-between;font-weight:650;margin-bottom:10px}.kanitem{background:#172337;border:1px solid #2a3952;border-radius:11px;padding:12px;margin:9px 0}.kanitem h4{margin:0 0 7px;font-size:13px}.kanmeta{display:flex;justify-content:space-between;gap:7px;color:var(--muted);font-size:11px;margin:9px 0}.kanitem select{width:100%;background:#101a2b;color:white;border:1px solid #33445f;padding:7px;border-radius:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calday{min-height:105px;background:#101a2a;border:1px solid var(--line);border-radius:9px;padding:7px;cursor:pointer;overflow:hidden}.calday:hover,.calday.selected{border-color:var(--accent);background:#1a2740}.calday.dim{opacity:.35}.calday .num{font-size:11px;color:#aab7ca}.calitem{font-size:10px;padding:3px 5px;border-radius:5px;background:#293768;color:#dbeafe;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.calitem.meet{background:#24463f;color:#a7f3d0}.weekday{text-align:center;color:var(--muted);font-size:11px;padding:7px}.projectcards{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.projectcard{background:linear-gradient(145deg,#152238,#101827);border:1px solid var(--line);border-radius:14px;padding:17px}.projectcard h3{margin:0 0 5px}.projectcard p{margin:4px 0;color:var(--muted)}.projectstats{display:flex;justify-content:space-between;margin-top:13px;font-size:12px}.empty{color:var(--muted);padding:18px;text-align:center}.pomodoro{text-align:center;padding:30px}.timer{font-size:64px;font-weight:750;letter-spacing:-.06em;margin:20px}.modes{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.field{margin:12px 0}.field label{display:block;color:#aab8ce;font-size:12px;margin-bottom:6px}.modalback{position:fixed;inset:0;background:#030712c9;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{background:#121d2e;border:1px solid #34435b;border-radius:16px;padding:21px;width:min(520px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 15px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.mobilemenu{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:8;left:-245px;width:230px;transition:.2s}.sidebar.open{left:0}.mobilemenu{display:inline-block}.topbar{padding:0 14px}.content{padding:18px 14px}.metrics{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.projectcards{grid-template-columns:1fr}.topright .hideMobile{display:none}}
@media(max-width:520px){.pagehead{align-items:center}.pagehead h1{font-size:21px}.metrics{gap:8px}.metric{padding:13px}.metric strong{font-size:23px}.calday{min-height:75px;padding:4px}.calitem{font-size:9px}.search{width:100%;max-width:none}.topright{gap:5px}.topbar{height:62px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">S</div><div><strong>STUDIO OS</strong><small>WORKSPACE · BH ARQUITECTOS</small></div></div>
<div class="navlabel">Workspace</div>
<button class="nav active" data-page="home"><span>◫</span>Hoy & Enfoque</button><button class="nav" data-page="kanban"><span>▦</span>Tablero Kanban</button><button class="nav" data-page="calendar"><span>▦</span>Agenda & Calendario</button><button class="nav" data-page="projects"><span>⌂</span>Proyectos y Obras</button><button class="nav" data-page="pomodoro"><span>◷</span>Temporizador</button>
<div class="navlabel">Herramientas</div><button class="nav" id="exportBtn"><span>⇩</span>Exportar respaldo</button><button class="nav" id="importBtn"><span>⇧</span>Importar respaldo</button><input type="file" id="importFile" accept="application/json" hidden>
<div class="sidefoot">Tus datos se guardan en este dispositivo.<br><span id="saveState">● Guardado local</span></div></aside>
<main class="main"><header class="topbar"><button class="mobilemenu" id="menuBtn">☰</button><input class="search" id="globalSearch" placeholder="⌕  Buscar tareas, proyectos o responsables…"><div class="topright"><button class="hideMobile" id="notifyBtn">Activar avisos</button><button class="primary" id="quickAdd">＋ Nuevo</button></div></header>
<div class="content" id="view"></div></main></div>
<div class="modalback" id="modalback"><div class="modal"><div id="modalContent"></div></div></div>
<script>
const KEY='studio_os_data_v1';
const statuses=['Por Hacer','En Proceso','En Revisión / Cliente','Completado'];
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Math.random().toString(36).slice(2,10);
const initial={projects:[],tasks:[],events:[],notes:'',selectedDate:today()};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial}catch{data=initial}
function save(){localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('saveState').textContent='● Guardado local';}
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateLabel(s){if(!s)return 'Sin fecha';return new Date(s+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'})}
function tasksFor(id){return data.tasks.filter(t=>t.projectId===id)}
function progress(p){let a=tasksFor(p.id);return a.length?Math.round(a.filter(t=>t.status==='Completado').length/a.length*100):0}
function projectName(id){return data.projects.find(p=>p.id===id)?.name||'Sin proyecto'}
function overdue(t){return t.due&&t.due<today()&&t.status!=='Completado'}
function notify(title,body){if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body})}
function alertSound(){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.12;o.start();o.stop(c.currentTime+.5)}catch{}}
function openModal(title,body,submitText,handler){$('#modalContent').innerHTML=`<h2>${title}</h2>${body}<div class="modalactions"><button id="cancelModal">Cancelar</button><button class="primary" id="submitModal">${submitText}</button></div>`;$('#modalback').classList.add('show');$('#cancelModal').onclick=closeModal;$('#submitModal').onclick=()=>{if(handler()!==false)closeModal()}}
function closeModal(){$('#modalback').classList.remove('show')}
function field(label,id,type='text',value='',extra=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,id,options,selected=''){return `<div class="field"><label>${label}</label><select id="${id}">${options.map(o=>`<option value="${esc(o)}" ${o===selected?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function addTask(){openModal('Nueva tarea',field('Título','tTitle')+selectField('Proyecto','tProject',['',...data.projects.map(p=>p.id)].map(x=>x),'' ).replace('<select id="tProject">','<select id="tProject"><option value="">Sin proyecto</option>')+field('Responsable','tOwner')+field('Fecha límite','tDue','date')+selectField('Prioridad','tPriority',['Media','Alta','Baja'],'Media')+selectField('Estado','tStatus',statuses,'Por Hacer'),'Crear tarea',()=>{let title=$('#tTitle').value.trim();if(!title)return false;data.tasks.push({id:uid(),title,projectId:$('#tProject').value,owner:$('#tOwner').value,due:$('#tDue').value,priority:$('#tPriority').value,status:$('#tStatus').value});save();render();return true})}
function addProject(){openModal('Nuevo proyecto',field('Nombre del proyecto','pName')+field('Cliente','pClient')+selectField('Categoría','pCat',['Arquitectura','Interiorismo','Comercial','Remodelación','Obra','Otro'],'Arquitectura')+field('Fecha de entrega','pDue','date')+field('Descripción breve','pDesc'), 'Crear proyecto',()=>{let name=$('#pName').value.trim();if(!name)return false;data.projects.push({id:uid(),name,client:$('#pClient').value,category:$('#pCat').value,due:$('#pDue').value,desc:$('#pDesc').value});save();render();return true})}
function addEvent(date=data.selectedDate||today()){openModal('Agendar cita',field('Título / reunión','eTitle')+field('Cliente','eClient')+`<div class="field"><label>Fecha</label><input id="eDate" type="date" value="${date}"></div>`+field('Hora de inicio','eStart','time','10:00')+field('Hora de fin','eEnd','time','11:00')+field('Ubicación o enlace Zoom','ePlace')+`<div class="field"><label>Notas</label><textarea id="eNotes" rows="3"></textarea></div>`,'Guardar cita',()=>{let title=$('#eTitle').value.trim();if(!title)return false;let ev={id:uid(),title,client:$('#eClient').value,date:$('#eDate').value,start:$('#eStart').value,end:$('#eEnd').value,place:$('#ePlace').value,notes:$('#eNotes').value};data.events.push(ev);save();notify('Cita agendada',`${title} · ${dateLabel(ev.date)} ${ev.start}`);render();return true})}
function taskRow(t){return `<div class="taskrow"><input type="checkbox" ${t.status==='Completado'?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><div class="taskmain"><b>${esc(t.title)}</b><small>${esc(projectName(t.projectId))} · ${dateLabel(t.due)}</small></div><span class="pill ${t.priority.toLowerCase()}">${esc(t.priority)}</span></div>`}
function toggleTask(id,checked){let t=data.tasks.find(x=>x.id===id);if(t){t.status=checked?'Completado':'Por Hacer';save();render()}}
function home(){let active=data.projects.length,week=new Date();let end=new Date();end.setDate(end.getDate()+7);let due=data.tasks.filter(t=>t.due&&new Date(t.due+'T12:00:00')>=new Date(today()+'T00:00:00')&&new Date(t.due+'T12:00:00')<=end&&t.status!=='Completado').length;let meetings=data.events.filter(e=>e.date===today()).sort((a,b)=>a.start.localeCompare(b.start));let late=data.tasks.filter(overdue);let critical=data.tasks.filter(t=>t.status!=='Completado'&&(t.priority==='Alta'||t.due===today()||overdue(t))).sort((a,b)=>(a.due||'').localeCompare(b.due||''));return `<div class="pagehead"><div><h1>Hoy & Enfoque</h1><p>${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · Tu centro de operaciones</p></div><button class="primary" onclick="addTask()">＋ Nueva tarea</button></div>${(late.length||meetings.length)?`<div class="alert">⚠ ${late.length?`${late.length} tarea(s) atrasada(s). `:''}${meetings.length?`${meetings.length} cita(s) programada(s) para hoy.`:''}</div>`:''}<div class="metrics"><div class="metric"><span class="mi">⌂</span><small>Proyectos activos</small><strong>${active}</strong></div><div class="metric"><span class="mi">◷</span><small>Entregas próximos 7 días</small><strong>${due}</strong></div><div class="metric"><span class="mi">▦</span><small>Citas de hoy</small><strong>${meetings.length}</strong></div><div class="metric"><span class="mi">!</span><small>Tareas atrasadas</small><strong>${late.length}</strong></div></div><div class="grid2"><section class="panel"><div class="sectionrow"><h3>⚡ Enfoque crítico de hoy</h3><span class="pill">${critical.length} pendientes</span></div>${critical.length?critical.slice(0,8).map(taskRow).join(''):'<div class="empty">Sin pendientes críticos. Buen momento para avanzar.</div>'}</section><section class="panel"><div class="sectionrow"><h3>▦ Reuniones de hoy</h3><button onclick="addEvent(today())">＋ Agendar</button></div>${meetings.length?meetings.map(e=>`<div class="eventrow"><div class="pill">${esc(e.start||'--:--')}</div><div class="taskmain"><b>${esc(e.title)}</b><small>${esc(e.client)} · ${esc(e.place)}</small></div></div>`).join(''):'<div class="empty">No tienes citas para hoy.</div>'}</section><section class="panel"><h3>Avance de proyectos</h3>${data.projects.length?data.projects.map(p=>`<div class="projectrow"><div class="projecttop"><b>${esc(p.name)}</b><span>${progress(p)}%</span></div><small class="muted">${esc(p.client||'Sin cliente')} · ${tasksFor(p.id).length} tareas</small><div class="bar"><i style="width:${progress(p)}%"></i></div></div>`).join(''):'<div class="empty">Agrega tu primer proyecto para ver avances.</div>'}</section><section class="panel"><div class="sectionrow"><h3>Bloc de notas rápido</h3><span class="pill">Autoguardado</span></div><textarea class="note" id="notes" placeholder="Ideas, llamadas pendientes, acuerdos, recordatorios…">${esc(data.notes)}</textarea></section></div>`}
function kanban(){let filter=window.projectFilter||'all';return `<div class="pagehead"><div><h1>Tablero Kanban</h1><p>Organiza el trabajo y mueve cada tarea de etapa.</p></div><button class="primary" onclick="addTask()">＋ Nueva tarea</button></div><div class="toolbar"><select id="projectFilter"><option value="all">Todos los proyectos</option>${data.projects.map(p=>`<option value="${p.id}" ${filter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="kanban">${statuses.map(s=>{let ts=data.tasks.filter(t=>t.status===s&&(filter==='all'||t.projectId===filter));return `<section class="kancol"><div class="kanhead">${s}<span class="pill">${ts.length}</span></div>${ts.map(t=>`<article class="kanitem"><h4>${esc(t.title)}</h4><div class="muted">${esc(projectName(t.projectId))}</div><div class="kanmeta"><span>${dateLabel(t.due)}</span><span class="pill ${t.priority.toLowerCase()}">${esc(t.priority)}</span></div><small class="muted">${esc(t.owner||'Sin responsable')}</small><select onchange="changeStatus('${t.id}',this.value)">${statuses.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('')}</select></article>`).join('')||'<div class="empty">Sin tareas</div>'}</section>`}).join('')}</div>`}
function changeStatus(id,s){let t=data.tasks.find(t=>t.id===id);if(t){t.status=s;save();render()}}
let calMonth=new Date().getMonth(),calYear=new Date().getFullYear();
function calendar(){let first=new Date(calYear,calMonth,1),offset=(first.getDay()+6)%7,days=new Date(calYear,calMonth+1,0).getDate(),cells=[];for(let i=0;i<offset;i++)cells.push(null);for(let d=1;d<=days;d++)cells.push(d);let chosen=data.selectedDate||today();return `<div class="pagehead"><div><h1>Agenda & Calendario</h1><p>Entregas, reuniones y fechas clave.</p></div><button class="primary" onclick="addEvent(data.selectedDate)">＋ Nueva cita</button></div><div class="panel"><div class="sectionrow"><button onclick="shiftMonth(-1)">‹</button><h3>${first.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</h3><button onclick="shiftMonth(1)">›</button></div><div class="calendar">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.map(d=>{if(!d)return '<div></div>';let dt=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ev=data.events.filter(e=>e.date===dt),ts=data.tasks.filter(t=>t.due===dt&&t.status!=='Completado');return `<div class="calday ${dt===chosen?'selected':''}" onclick="selectDate('${dt}')"><div class="num">${d}</div>${ev.map(e=>`<div class="calitem meet">● ${esc(e.start)} ${esc(e.title)}</div>`).join('')}${ts.map(t=>`<div class="calitem">◆ ${esc(t.title)}</div>`).join('')}</div>`}).join('')}</div></div><section class="panel" style="margin-top:14px"><div class="sectionrow"><h3>${dateLabel(chosen)} · Agenda del día</h3><button onclick="addEvent('${chosen}')">＋ Agendar aquí</button></div>${data.events.filter(e=>e.date===chosen).map(e=>`<div class="eventrow"><span class="pill">${esc(e.start)}–${esc(e.end)}</span><div class="taskmain"><b>${esc(e.title)} · ${esc(e.client)}</b><small>${esc(e.place)} ${e.notes?'· '+esc(e.notes):''}</small></div><button class="danger" onclick="deleteEvent('${e.id}')">×</button></div>`).join('')||'<div class="empty">No hay citas este día.</div>'}${data.tasks.filter(t=>t.due===chosen).map(t=>`<div class="eventrow"><span class="pill">Entrega</span><div class="taskmain"><b>${esc(t.title)}</b><small>${esc(projectName(t.projectId))}</small></div></div>`).join('')}</section>`}
function shiftMonth(n){calMonth+=n;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}render()}
function selectDate(d){data.selectedDate=d;save();render()}
function deleteEvent(id){data.events=data.events.filter(e=>e.id!==id);save();render()}
function projects(){return `<div class="pagehead"><div><h1>Proyectos y Obras</h1><p>Clientes, categorías y avance de cada proyecto.</p></div><button class="primary" onclick="addProject()">＋ Nuevo proyecto</button></div><div class="projectcards">${data.projects.map(p=>`<article class="projectcard"><div class="projecttop"><div><h3>${esc(p.name)}</h3><p>${esc(p.client||'Cliente por definir')} · ${esc(p.category)}</p></div><span class="pill">${progress(p)}%</span></div><div class="bar"><i style="width:${progress(p)}%"></i></div><div class="projectstats"><span>${tasksFor(p.id).filter(t=>t.status==='Completado').length}/${tasksFor(p.id).length} tareas terminadas</span><span>Entrega: ${dateLabel(p.due)}</span></div><p>${esc(p.desc||'Sin descripción')}</p><div class="toolbar" style="margin:12px 0 0"><button onclick="addTaskFor('${p.id}')">＋ Añadir tarea</button><button class="danger" onclick="deleteProject('${p.id}')">Eliminar</button></div></article>`).join('')||'<div class="empty">Aún no hay proyectos. Crea el primero para comenzar.</div>'}</div>`}
function addTaskFor(id){addTask();setTimeout(()=>{let s=$('#tProject');if(s)s.value=id},30)}
function deleteProject(id){if(confirm('¿Eliminar proyecto? Las tareas asociadas también se eliminarán.')){data.projects=data.projects.filter(p=>p.id!==id);data.tasks=data.tasks.filter(t=>t.projectId!==id);save();render()}}
let mode='focus',remaining=1500,interval=null,running=false;
function pomodoro(){return `<div class="pagehead"><div><h1>Temporizador de enfoque</h1><p>Trabaja en bloques y descansa de verdad.</p></div></div><div class="panel pomodoro"><div class="modes"><button onclick="setMode('focus')">Enfoque · 25 min</button><button onclick="setMode('short')">Descanso · 5 min</button><button onclick="setMode('long')">Descanso largo · 15 min</button></div><div class="timer" id="timer">${fmt(remaining)}</div><div class="muted" id="modeLabel">${mode==='focus'?'Sesión de enfoque':mode==='short'?'Descanso corto':'Descanso largo'}</div><div style="display:flex;gap:9px;justify-content:center;margin-top:20px"><button class="primary" id="startTimer" onclick="toggleTimer()">${running?'Pausar':'Iniciar'}</button><button onclick="resetTimer()">Reiniciar</button></div><p class="muted" style="margin-top:25px">Consejo: elige una sola tarea antes de iniciar. Al terminar escucharás una alerta.</p></div>`}
function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function setMode(m){pauseTimer();mode=m;remaining=m==='focus'?1500:m==='short'?300:900;render()}
function toggleTimer(){if(running){pauseTimer()}else{running=true;interval=setInterval(()=>{remaining--;let el=$('#timer');if(el)el.textContent=fmt(remaining);if(remaining<=0){pauseTimer();alertSound();notify('Pomodoro terminado',mode==='focus'?'¡Buen trabajo! Tómate un descanso.':'Descanso terminado. ¡A continuar!');alert(mode==='focus'?'¡Bloque terminado! Hora de descansar.':'¡Descanso terminado!');}},1000);$('#startTimer').textContent='Pausar'}}
function pauseTimer(){running=false;if(interval)clearInterval(interval);interval=null;let b=$('#startTimer');if(b)b.textContent='Iniciar'}
function resetTimer(){pauseTimer();remaining=mode==='focus'?1500:mode==='short'?300:900;let el=$('#timer');if(el)el.textContent=fmt(remaining)}
let page='home',query='';
function render(){let v=$('#view');v.innerHTML=page==='home'?home():page==='kanban'?kanban():page==='calendar'?calendar():page==='projects'?projects():pomodoro();document.querySelectorAll('.nav[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if($('#notes'))$('#notes').addEventListener('input',e=>{data.notes=e.target.value;save()});if($('#projectFilter'))$('#projectFilter').onchange=e=>{window.projectFilter=e.target.value;render()};if(query)applySearch()}
function applySearch(){let q=query.toLowerCase();document.querySelectorAll('.taskrow,.kanitem,.projectrow,.projectcard,.eventrow').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'':'none')}
document.querySelectorAll('.nav[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;$('#sidebar').classList.remove('open');render()});
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
$('#quickAdd').onclick=()=>openModal('Crear nuevo',`<p class="muted">¿Qué quieres agregar?</p><button class="primary" style="width:100%;margin:5px 0" onclick="closeModal();addTask()">＋ Tarea</button><button style="width:100%;margin:5px 0" onclick="closeModal();addProject()">＋ Proyecto</button><button style="width:100%;margin:5px 0" onclick="closeModal();addEvent(today())">＋ Cita</button>`,'Cerrar',()=>true);
$('#notifyBtn').onclick=async()=>{if(!('Notification'in window)){alert('Este navegador no admite notificaciones.');return}let p=await Notification.requestPermission();alert(p==='granted'?'Avisos activados en este navegador.':'No se concedió permiso.');};
$('#globalSearch').oninput=e=>{query=e.target.value;render()};
$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='studio-os-respaldo.json';a.click();URL.revokeObjectURL(a.href)};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.projects||!d.tasks||!d.events)throw 0;data=d;save();render();alert('Respaldo importado.')}catch{alert('El archivo no es válido.')}};r.readAsText(f)};
$('#modalback').onclick=e=>{if(e.target.id==='modalback')closeModal()};
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script></body></html>
